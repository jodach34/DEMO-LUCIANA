name: .NET y Docker

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror
      - name: Test (si existen proyectos de pruebas)
        shell: bash
        run: |
          if find tests -name '*Tests.csproj' -print -quit | grep -q .; then
            dotnet test --no-build --configuration Release --logger trx --results-directory TestResults
          fi
      - name: Verificar migraciones
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Convalidacion.Web --configuration Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: TestResults/*.trx
          if-no-files-found: ignore
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build --tag convalidacion-demo:ci .
      - name: Comprobar arranque y puerto de Render
        shell: bash
        run: |
          docker run -d --name convalidacion-ci -e PORT=10000 -p 10000:10000 convalidacion-demo:ci
          trap 'docker logs convalidacion-ci; docker rm -f convalidacion-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:10000/health; then
              curl --fail --silent http://localhost:10000/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
